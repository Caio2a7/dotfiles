general {
    gaps_in = 0
    gaps_out = 5
    border_size = 1
    col.active_border = rgb(343B47)
    col.inactive_border = rgb(000000)
}

decoration {
    active_opacity = 0.95
    dim_special = 0.0
    inactive_opacity = 0.80
    rounding = 10

    shadow {
      enabled = true
      range = 5
      render_power = 4
      color = rgba(343B47ee)
      color_inactive = rgba(000000ee)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.02
        vibrancy = 0.5
        vibrancy_darkness = 0.7
        contrast = 1.0
        brightness = 1.0
        special = false
    }
}

animations {
    enabled = true

    bezier = smoothOut,  0.36, 0, 0.66, -0.56
    bezier = smoothIn,   0.25, 1, 0.5,  1
    bezier = overshot,   0.05, 0.9, 0.1, 1.1    # leve "quique" no fim
    bezier = macos,      0.16, 1, 0.3,  1        # bem próximo do macOS

    animation = windowsIn,   1, 5,  smoothIn,  slide
    animation = windowsOut,  1, 4,  smoothOut, slide
    animation = windowsMove, 1, 5,  macos,     slide

    animation = fade,        1, 4,  smoothIn
    animation = fadeIn,      1, 5,  smoothIn
    animation = fadeOut,     1, 4,  smoothOut

    animation = workspaces,         1, 5, macos, slide
    animation = specialWorkspace,   1, 4, macos, slidevert
}

misc {
    enable_swallow            = true   # janela "engole" o terminal que a abriu
    swallow_regex             = ^(alacritty|kitty)$
    focus_on_activate         = false
}
