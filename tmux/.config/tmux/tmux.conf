unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -sg escape-time 0
set -g mouse on
set -g set-titles on
set -g set-titles-string "#T"
set -g renumber-windows on
set -g exit-empty off
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
bind-key -n C-Tab send-keys C-Tab
bind-key -n C-S-Tab send-keys C-S-Tab
bind-key -n M-w new-window -c "#{pane_current_path}"
bind-key -n M-k detach-client
bind-key -n M-q kill-pane
bind-key -n M-p next-window
bind-key -n M-e select-pane -t :.+
bind-key -n M-n command-prompt -I "#{session_name}" "rename-session '%%'"
bind-key -n M-t choose-tree -Zs
bind-key -n M-l choose-tree -Zs
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-h split-window -v -c "#{pane_current_path}"
bind-key -n M-f resize-pane -Z
unbind-key -n M-z
unbind-key M-z
unbind-key -n M-Z
unbind-key M-Z
# bind-key -n M-S set-window-option synchronize-panes
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-s run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"
bind-key -n M-r run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh"
set -g @resurrect-save 's'
set -g @resurrect-restore 'r'
bind -n x if -F '#{==:#{pane_mode},tree-mode}' 'send x ; send y' 'send x'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'T1erno/tmux-auto-renumber-session'
# set -g @continuum-restore 'on'
set -g focus-events on
set -g pane-border-lines single
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1A1923 fg=#00D4FF"
set -g status-left-length 40
set -g status-right-length 60
set -g status-right "#[bg=#1A1923 fg=#00D4FF] %H:%M  %d/%m/%Y"
set -g window-status-format "#[bg=#1A1923 fg=#00D4FF] #I:#W "
set -g window-status-current-format "#[bg=#00D4FF fg=#1A1923 bold] #I:#W "
set -g status-left "#[bg=#2AB9AC fg=#1A1923 bold] #S "
set -g pane-border-style "fg=#00D4FF"
set -g pane-active-border-style "fg=#0BE6B0"
set -g message-style "bg=#1A1923 fg=#00D4FF bold"
setw -g mode-keys vi
set -g mode-style "bg=#00D4FF fg=#1A1923"
set -g allow-passthrough on
set -g destroy-unattached off   # ← explícito, não depende do default
set-hook -g client-detached "run-shell \"tmux list-clients -t '#{session_name}' 2>/dev/null | grep -q . || (echo '#{session_name}' | grep -qE '^[0-9]+$' && tmux kill-session -t '#{session_name}')\""

set -ga update-environment "TERM_PROGRAM WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE"
run '~/dotfiles/tmux/.config/tmux/plugins/tpm/tpm'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi C-c send-keys -X copy-selection
