# general.import = [ "~/.config/omarchy/current/theme/alacritty.toml" ]
[env]
TERM = "xterm-256color"
# ──────────────────────────────────────────────
#  Colors  (extraídas do tema Neovim)
# ──────────────────────────────────────────────
[colors.primary]
background = "#16161E"   # fundo escuro neutro
foreground = "#E0E0E0"   # branco_pont – texto base
[colors.cursor]
cursor = "#FFD700"   # dourado
text   = "#1e1e2e" 
[colors.vi_mode_cursor]
text   = "#16161E"
cursor = "#FFD700"   # dourado
[colors.selection]
text       = "#16161E"
background = "#59A6E6"   # azul_tipo
[colors.search.matches]
foreground = "#16161E"
background = "#D9D9A6"   # amarelo_func
[colors.search.focused_match]
foreground = "#16161E"
background = "#E03B8B"   # rosa_magenta_vibrante
# ── 8 cores normais ───────────────────────────
[colors.normal]
black   = "#2A2A3E"      # sombra do fundo
red     = "#E03B8B"      # rosa_magenta_vibrante  → erros, diff -
green   = "#6BA157"      # verde_coment           → sucesso, diff +
yellow  = "#D9D9A6"      # amarelo_func           → avisos, funções
blue    = "#59A6E6"      # azul_tipo              → info, tipos
magenta = "#D986C8"      # rosa_suave             → keywords return/repeat
cyan    = "#47D1B2"      # verde_struct           → structs, tipos custom
white   = "#E0E0E0"      # branco_pont            → texto padrão
# ── 8 cores brilhantes ────────────────────────
[colors.bright]
black   = "#555555"      # MatchParen bg          → comentários apagados
red     = "#FF6BB5"      # rosa_magenta clareado  → erros em destaque
green   = "#BCE38D"      # limao_num              → números, booleanos
yellow  = "#E69B7A"      # marrom_str             → strings
blue    = "#9EE5FF"      # azul_claro_var         → variáveis, campos
magenta = "#E8A0DC"      # rosa_suave clareado    → keywords destaque
cyan    = "#7AEBD6"      # verde_struct clareado  → tipos destaque
white   = "#FFFFFF"      # branco_puro            → títulos, bold text
# ──────────────────────────────────────────────


[font]
normal  = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold    = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic  = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size    = 15
builtin_box_drawing = true

[font.offset]
x = 0
y = -1

[font.glyph_offset]
x = 0
y = 0

[terminal.shell]
program = "/bin/bash"
args    = ["-c", "tmux new-session"]

[window]
padding = { x = 2, y = 0 }
dynamic_padding = true
decorations = "None"

[[keyboard.bindings]]
key    = "Insert"
mods   = "Shift"
action = "Paste"

